[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddc-audit"
version = "0.2.1"
description = "Pre-submission audit tool: does a single-cell perturbation prediction model actually distinguish drugs? Computes the drug-discrimination control (DDC) AUC, confidence intervals, permutation p-values, and the no-drug-information anchor from stored predictions alone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Xichen Zhao" }, { name = "Guanxing Chen", email = "cgx510510@gmail.com" }]
keywords = ["single-cell", "perturbation", "drug-response", "evaluation", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy==2.2.5",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
]

[project.scripts]
ddc-audit = "ddc_audit.cli:main"

[project.urls]
Homepage = "https://github.com/schambergeredmund7111992-cmyk/ddc-audit"
Repository = "https://github.com/schambergeredmund7111992-cmyk/ddc-audit"
"Issues" = "https://github.com/schambergeredmund7111992-cmyk/ddc-audit/issues"
"Research repository" = "https://github.com/schambergeredmund7111992-cmyk/cytobridge-benchmark"

[project.optional-dependencies]
dev = ["pytest>=8", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
