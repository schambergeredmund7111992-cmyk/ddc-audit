name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        working-directory: .
        run: python -m pip install --upgrade pip && python -m pip install . pytest

      - name: Run the test suite
        run: python -m pytest -q -rs

      - name: Synthetic quickstart
        shell: bash
        run: |
          ddc-audit make-example --out examples/synthetic
          ddc-audit run \
            --predictions examples/synthetic/predictions_collapsed.npy \
            --targets     examples/synthetic/targets.npy \
            --meta        examples/synthetic/meta.csv \
            --out         ci_audit \
            --n-boot 100 --n-perm 100

      - name: Real per-pair audit on the shipped evidence
        shell: bash
        run: |
          ddc-audit run \
            --predictions evidence/prediction_loss_only_perpair.npy \
            --targets     evidence/target_perpair.npy \
            --meta        evidence/pair_order.csv \
            --vehicle-profiles evidence/vehicle_profiles_perpair_control.npy \
            --vehicle-treated  evidence/vehicle_profiles_perpair_treated.npy \
            --manifest    evidence/manifests/input_manifest_perpair.json \
            --out         ci_audit_perpair \
            --n-boot 100 --n-perm 100
